<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Health</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(160deg, #81C784 0%, #4CAF50 100%);
      color: #ffffff;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .heart { font-size: 64px; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 2.4rem; margin: 8px 0 4px; font-weight: 800; }
    .tag { font-size: 1.1rem; opacity: 0.92; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 14px 20px;
      border-radius: 14px;
      background: #ffffff;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.1s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn.ghost { background: rgba(255,255,255,0.18); color: #ffffff; }
    footer { margin-top: 28px; font-size: 0.85rem; opacity: 0.8; }
    footer a { color: #ffffff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">&#10084;&#65039;</div>
    <h1>Hello Health</h1>
    <p class="tag">Your all-in-one health companion — activity, sleep, nutrition, mood &amp; AI coaching.</p>
    <div class="links">
      <a class="btn ghost" href="privacy-policy.html">Privacy Policy</a>
      <a class="btn ghost" href="terms-of-service.html">Terms of Service</a>
    </div>
    <footer>
      Contact: <a href="mailto:pranayharjai7@gmail.com">pranayharjai7@gmail.com</a>
    </footer>
  </div>
</body>
</html>
